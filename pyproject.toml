[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cp4ai"
version = "3.1.0"
description = "Copy 4 AI: convert lecture notes from DOCX, PDF and PPTX into recall-first Markdown for LLM ingestion."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pymupdf==2.1",
    "numpy==2.5.5",
    "tiktoken==0.14.0",
]

[project.scripts]
md4ai = "cp4ai.md4ai:main"
cp4ai = "cp4ai.cp4ai:main"
cp4ai-setup = "cp4ai.setup:main"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/cp4ai"]
